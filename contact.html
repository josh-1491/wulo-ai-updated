<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contact — Wulo AI</title>
<meta name="description" content="Get in touch with the Wulo AI team." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --ground: #ffffff; --surface: #ffffff; --surface-raised: #f2f1f0;
    --ink: #0c0a09; --ink-soft: #4d4d51; --ink-faint: #71737a;
    --line: #e6e6e7; --line-soft: #f0f0ef;
    --accent: #96ff1a; --accent-ink: #083300; --accent-text: #3c7a00; --accent-soft: #e6ffc8; --accent-soft-line: #c2ec8a;
    --shadow: 220 30% 5%;
    --serif: "Playfair Display", "Didot", "Bodoni MT", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #ffffff; --surface: #ffffff; --surface-raised: #f2f1f0;
      --ink: #0c0a09; --ink-soft: #4d4d51; --ink-faint: #71737a;
      --line: #e6e6e7; --line-soft: #f0f0ef;
      --accent: #96ff1a; --accent-ink: #083300; --accent-text: #3c7a00;
      --accent-soft: #e6ffc8; --accent-soft-line: #c2ec8a;
    }
  }
  :root[data-theme="dark"] {
    --ground: #ffffff; --surface: #ffffff; --surface-raised: #f2f1f0;
    --ink: #0c0a09; --ink-soft: #4d4d51; --ink-faint: #71737a;
    --line: #e6e6e7; --line-soft: #f0f0ef;
    --accent: #96ff1a; --accent-ink: #083300; --accent-text: #3c7a00;
    --accent-soft: #e6ffc8; --accent-soft-line: #c2ec8a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  img, svg { display: block; max-width: 100%; }
  ::selection { background: #d6ffa6; color: #083300; }
  :focus-visible { outline: 2px solid #3c7a00; outline-offset: 2px; border-radius: 4px; }

  .nav { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--ground) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line-soft); }
  .nav-row { max-width: 46rem; margin: 0 auto; padding: 0.95rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .brand { display: flex; align-items: center; gap: 0.55rem; text-decoration: none; }
  .brand-mark { width: 24px; height: 20px; color: var(--ink); flex: none; }
  .back-link { font-family: var(--sans); font-size: 0.85rem; color: var(--ink-soft); text-decoration: none; }
  .back-link:hover { color: var(--ink); }

  .wrap { max-width: 46rem; margin: 0 auto; padding: 3.5rem 1.5rem 5rem; }
  .eyebrow { font-family: var(--sans); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent-text); margin: 0 0 0.9rem; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(1.9rem, 1.5rem + 2vw, 2.7rem); line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 1.1rem; text-wrap: balance; }
  .lede { font-size: 1.05rem; line-height: 1.6; color: var(--ink-soft); margin: 0 0 2rem; max-width: 34rem; }

  .contact-band { margin-top: 1rem; padding: 1.8rem; border-radius: 16px; background: var(--surface-raised); border: 1px solid var(--line-soft); }
  .contact-band h2 { font-family: var(--serif); font-weight: 500; font-size: 1.3rem; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
  .contact-band p { font-size: 0.95rem; line-height: 1.6; color: var(--ink-soft); margin: 0 0 1.1rem; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; font-family: var(--sans); font-weight: 600; font-size: 0.95rem; border-radius: 10px; padding: 0.75rem 1.4rem; text-decoration: none; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent-ink); }
  .btn-primary:hover { filter: brightness(0.97); }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-row">
    <a class="brand" href="index.html">
      <svg class="brand-mark" viewBox="0 0 27 22" fill="none" aria-hidden="true">
        <circle cx="9" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6" />
        <circle cx="18" cy="11" r="6.5" stroke="currentColor" stroke-width="1.6" />
      </svg>
    </a>
    <a class="back-link" href="index.html">← Back to Wulo AI</a>
  </div>
</header>

<main class="wrap">
  <p class="eyebrow">Contact</p>
  <h1>Get in touch</h1>
  <p class="lede">Have a question, feedback, or an idea for Wulo AI? Send us an email and we'll get back to you.</p>

  <div class="contact-band">
    <h2>Email us</h2>
    <p>For support, billing questions, or anything else — this is the fastest way to reach us.</p>
    <a class="btn btn-primary" href="mailto:wulo@wuloai.com">wulo@wuloai.com</a>
  </div>
</main>

</body>
</html>
